<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="theme-color" content="#f4f1ea">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBA Draft Auction</title>
<style>
:root{--bg:#f4f1ea;--bg2:#ebe6db;--fg:#1c1b19;--card:#fff;--mute:#7a766c;--line:#e6e1d6;--a:#e8590c;--a2:#ff8a3d;--b:#1c7ed6;--b2:#4dabf7;--gold:#b8860b;--sh:0 1px 2px rgba(28,27,25,.06),0 8px 24px rgba(28,27,25,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--bg2:#1a1917;--fg:#f1efe9;--card:#1f1e1c;--mute:#a09b90;--line:#34322e;--a:#ff8a4c;--a2:#ffb07a;--b:#5aa9ff;--b2:#8cc4ff;--gold:#e6b422;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121211;--bg2:#1a1917;--fg:#f1efe9;--card:#1f1e1c;--mute:#a09b90;--line:#34322e;--a:#ff8a4c;--a2:#ffb07a;--b:#5aa9ff;--b2:#8cc4ff;--gold:#e6b422;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{min-height:100vh;color:var(--fg);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
background:radial-gradient(900px 420px at 50% -120px,color-mix(in srgb,var(--a) 14%,transparent),transparent 70%),radial-gradient(700px 360px at 100% 0,color-mix(in srgb,var(--b) 10%,transparent),transparent 70%),repeating-linear-gradient(0deg,transparent 0 46px,color-mix(in srgb,var(--fg) 3%,transparent) 46px 47px),var(--bg);background-attachment:fixed}
#app{max-width:520px;margin:0 auto;padding:16px 14px 28px}
h1{font-size:22px;font-weight:900;letter-spacing:.02em;margin:2px 0 14px;text-align:center;background:linear-gradient(90deg,var(--a),var(--gold) 50%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px 8px;box-shadow:var(--sh);overflow:hidden}
.team::before{content:"";position:absolute;left:0;right:0;top:0;height:5px}
.team.t0::before{background:linear-gradient(90deg,var(--a),var(--a2))}.team.t1::before{background:linear-gradient(90deg,var(--b),var(--b2))}
.team.t0{background:linear-gradient(180deg,color-mix(in srgb,var(--a) 7%,var(--card)),var(--card) 60%)}.team.t1{background:linear-gradient(180deg,color-mix(in srgb,var(--b) 7%,var(--card)),var(--card) 60%)}
.team h2{margin:2px 0 0;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.t0 h2{color:var(--a)}.t1 h2{color:var(--b)}
.cash{display:inline-block;font-size:24px;font-weight:900;margin:2px 0 6px}
.slot{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 4px;margin:0 -4px;border-top:1px solid var(--line);border-radius:8px;cursor:pointer;transition:background .15s}
.slot:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.slot b{flex:none;width:26px;text-align:center;font-size:10px;font-weight:800;color:var(--mute);background:var(--bg2);border-radius:6px;padding:2px 0}
.slot span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.slot i{font-style:normal;color:var(--mute);font-size:11px}
.slot.sel{background:color-mix(in srgb,var(--gold) 20%,transparent);box-shadow:inset 0 0 0 2px var(--gold)}
.chem{font-size:11px;color:var(--mute);margin-top:6px;line-height:1.35}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px;margin:12px 0;text-align:center;box-shadow:var(--sh)}
.pcard{position:relative;border-top:5px solid var(--tc,var(--line));background:radial-gradient(380px 190px at 50% 0,color-mix(in srgb,var(--tc,transparent) 20%,transparent),transparent 70%),var(--card);animation:rise .22s ease-out}
@keyframes rise{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}
.pos{display:inline-block;background:linear-gradient(135deg,var(--fg),color-mix(in srgb,var(--fg) 70%,var(--bg)));color:var(--bg);border-radius:8px;padding:3px 12px;font-weight:800;font-size:13px;letter-spacing:.08em}
.name{font-size:27px;font-weight:900;line-height:1.1;margin:10px 0 2px;letter-spacing:-.01em}
.tier{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;margin:6px 0 2px;padding:3px 12px;border-radius:999px;background:color-mix(in srgb,currentColor 13%,transparent)}
.tag{font-size:13px;color:var(--mute)}.tag.L{display:inline-block;color:var(--gold);font-weight:800;background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:999px;padding:2px 12px;margin:4px 0}
.tag.N{display:inline-block;font-weight:700;background:var(--bg2);border-radius:999px;padding:2px 12px;margin:4px 0}
.stat{font-size:14px;color:var(--mute);margin:10px 0 4px;line-height:1.7}.stat b{font-size:21px;font-weight:900;color:var(--fg)}
.stat2{font-size:13px;color:var(--mute);margin:3px 0}.stat2 b{font-size:15px;color:var(--fg)}
.typ{display:inline-block;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px 14px;font-weight:800;font-size:13px;margin:8px 0 2px}
.bid{display:inline-block;font-size:16px;margin-top:10px;padding:8px 18px;border-radius:14px;background:var(--bg2)}.bid b{font-size:24px;font-weight:900;color:var(--gold)}
.av{width:88px;height:88px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff;box-shadow:0 0 0 4px var(--card),0 0 0 6px color-mix(in srgb,var(--fg) 12%,transparent),0 10px 22px rgba(0,0,0,.22),inset 0 -8px 14px rgba(0,0,0,.18),inset 0 6px 10px rgba(255,255,255,.18)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--sh)}
.c0.col{border-top:4px solid var(--a)}.c1.col{border-top:4px solid var(--b)}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:11px;color:#fff;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.12);transition:transform .08s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.06)}button:active:not(:disabled){transform:translateY(1px) scale(.99);box-shadow:0 1px 0 rgba(0,0,0,.18)}
button:disabled{opacity:.32;cursor:not-allowed;box-shadow:none}
.c0 button{background:linear-gradient(180deg,var(--a2),var(--a))}.c1 button{background:linear-gradient(180deg,var(--b2),var(--b))}
.lbl{font-size:12px;font-weight:800;text-align:center;letter-spacing:.04em}.c0 .lbl{color:var(--a)}.c1 .lbl{color:var(--b)}
.sold{width:100%;margin-top:12px;padding:14px;font-size:15px;background:linear-gradient(180deg,color-mix(in srgb,var(--fg) 82%,var(--bg)),var(--fg));color:var(--bg)}
.sold+.sold{margin-top:8px}
.msg{text-align:center;color:var(--mute);font-size:13px;min-height:18px;margin:10px 0 2px}
.big{font-size:30px;font-weight:900;text-align:center;margin:14px 0;background:linear-gradient(90deg,var(--a),var(--gold),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sb{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}.sb th{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:4px 2px}
.sb td,.sb th{padding:6px 3px;text-align:center}.sb td:first-child{text-align:left;font-weight:800}.sb tr+tr td{border-top:1px solid var(--line)}
.sb .t0 td:first-child{color:var(--a)}.sb .t1 td:first-child{color:var(--b)}.bx tr:nth-child(even) td{background:color-mix(in srgb,var(--fg) 3.5%,transparent)}
.bx{font-size:11px;white-space:nowrap}.bx td:first-child{white-space:nowrap}
.caps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.cp{padding:7px 12px;font-size:12px;border-radius:999px;opacity:.5;box-shadow:none}.cp.on{opacity:1;outline:3px solid color-mix(in srgb,var(--gold) 70%,transparent);outline-offset:1px}
.cp.c0{background:linear-gradient(180deg,var(--a2),var(--a))}.cp.c1{background:linear-gradient(180deg,var(--b2),var(--b))}
.pk.c0{background:linear-gradient(180deg,var(--a2),var(--a))}.pk.c1{background:linear-gradient(180deg,var(--b2),var(--b))}
.tgl{margin:6px 0 12px;font-size:13px;color:var(--mute);text-align:center}
input,select{font:inherit;padding:11px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 22%,transparent)}input:disabled{opacity:.3}
.mvp{border:2px solid var(--gold);background:radial-gradient(360px 180px at 50% 0,color-mix(in srgb,var(--gold) 24%,transparent),transparent 70%),var(--card);animation:rise .3s ease-out}
.mvp .tag:first-child{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.code{display:inline-block;font-size:34px;font-weight:900;letter-spacing:.3em;margin:8px 0;padding:6px 8px 6px 20px;border:2px dashed var(--gold);border-radius:14px;background:var(--bg2)}
.sec{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px}
.sec::before,.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.lv{color:var(--mute);font-size:13px;text-align:center;margin:12px 0}.lv a{color:var(--mute)}
.hero{text-align:center;margin:4px 0 2px}
.ball{font-size:56px;line-height:1;display:inline-block;animation:bnc 1.5s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.25))}
@keyframes bnc{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(14deg)}}
.hero h1{font-size:30px;margin:6px 0 2px}
.hs{color:var(--mute);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sg{cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--sh);transition:.15s;opacity:.7}
.sg.on{opacity:1;border-color:var(--gold);background:radial-gradient(200px 90px at 50% 0,color-mix(in srgb,var(--gold) 26%,transparent),transparent 75%),var(--card);transform:translateY(-1px)}
.sg span{font-size:26px;display:block}.sg b{display:block;font-size:14px;margin-top:2px}.sg small{color:var(--mute);font-size:11px}
.mc{position:relative;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 15%,var(--card)),var(--card) 68%);border:1px solid color-mix(in srgb,var(--c) 38%,var(--line));border-radius:22px;padding:18px 14px 14px;margin:12px 0;box-shadow:var(--sh);overflow:hidden}
.mc::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--c),var(--c2))}
.m-local{--c:var(--a);--c2:var(--a2)}.m-bot{--c:#7048e8;--c2:#b197fc}.m-net{--c:var(--b);--c2:var(--b2)}
.mh{display:flex;align-items:center;gap:12px}
.mi{flex:none;width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(135deg,var(--c2),var(--c));box-shadow:0 6px 14px color-mix(in srgb,var(--c) 40%,transparent),inset 0 -6px 10px rgba(0,0,0,.15)}
.mt{font-weight:900;font-size:18px;color:var(--c);line-height:1.15}
.md{font-size:12px;color:var(--mute);margin-top:2px}
.pl{margin-left:auto;flex:none;font-size:10px;font-weight:900;letter-spacing:.08em;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.mb{width:100%;margin-top:12px;padding:14px;font-size:15px;background:linear-gradient(180deg,var(--c2),var(--c))}
.lvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.lvc{cursor:pointer;border:2px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center;font-weight:800;font-size:13px;background:var(--card);transition:.15s}
.lvc.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--c)}
.or{display:flex;align-items:center;gap:10px;margin:14px 0 2px;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--mute)}
.or::before,.or::after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--c) 30%,var(--line))}
.jr{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.jr button{margin:0;padding:11px 22px}
.jr input{text-align:center;font-weight:900;letter-spacing:.3em;font-size:18px}
.mc .code{display:block;text-align:center;border-color:var(--c);margin:10px 0}
.sbd{padding:16px 12px}
.sbr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:10px 0 4px}
.sbn{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbt.t0 .sbn,.sbt.t0 .sbs{color:var(--a)}.sbt.t1 .sbn,.sbt.t1 .sbs{color:var(--b)}
.sbs{font-size:56px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.sbs.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1.3)}100%{transform:scale(1)}}
.sbm{text-align:center;min-width:84px}.sbq{font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--gold)}
.sbc{font-size:26px;font-weight:900;font-family:ui-monospace,Menlo,Consolas,monospace}
.pbar{height:6px;border-radius:999px;background:var(--bg2);overflow:hidden;margin:10px 0 12px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--gold),var(--b))}
.spds{display:flex;gap:6px;align-items:center;justify-content:center;font-size:12px;color:var(--mute);font-weight:800}
button.spd{padding:6px 14px;border-radius:999px;font-size:13px;background:var(--bg2);color:var(--fg);box-shadow:none;border:2px solid var(--line)}
button.spd.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,var(--bg2))}
.feed{min-height:150px;margin-top:10px;text-align:left}
.fe{font-size:13px;padding:6px 10px;border-radius:10px;margin:4px 0;background:var(--bg2);border-left:4px solid var(--line);animation:rise .2s ease-out}
.fe.t0{border-left-color:var(--a)}.fe.t1{border-left-color:var(--b)}.fe b{font-size:15px}.fe small{color:var(--mute);float:right}
.av{position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 10%}
.sa{flex:none;width:22px;height:22px;border-radius:50%;object-fit:cover;object-position:50% 10%;background:var(--bg2)}
.turn{text-align:center;font-weight:800;padding:9px;border-radius:12px;margin:10px 0;font-size:15px}.turn.yt{background:color-mix(in srgb,#22c55e 18%,transparent);color:#16a34a}.turn.bt{background:color-mix(in srgb,#f59e0b 18%,transparent);color:#d97706}

.ribbon{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.2em;color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:999px;padding:3px 14px;margin-bottom:10px}
.pcard.xl{padding:22px 16px 20px;border-radius:26px;box-shadow:0 0 0 1px var(--line),0 0 38px color-mix(in srgb,var(--tc,transparent) 32%,transparent),var(--sh)}
.xl .av{width:128px;height:128px;font-size:44px;margin-bottom:14px}
.xl .pos{font-size:15px;padding:5px 18px}
.xl .name{font-size:34px;margin:12px 0 4px}
.xl .tier{font-size:14px;padding:4px 16px}
.xl .stat{font-size:15px;margin:14px 0 6px}.xl .stat b{font-size:28px}
.xl .stat2{font-size:14px}.xl .stat2 b{font-size:17px}
.xl .bid{font-size:18px;margin-top:16px;padding:12px 26px;border-radius:18px;border:2px solid color-mix(in srgb,var(--gold) 40%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 14%,var(--bg2)),var(--bg2))}
.xl .bid b{font-size:40px;line-height:1;animation:bidpop .3s ease-out}
@keyframes bidpop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.bz .col{padding:14px;gap:10px;border-radius:20px}
.bz input{font-size:20px;padding:14px;text-align:center;font-weight:800}
.bz button{padding:14px;font-size:16px;border-radius:14px}
.bz .lbl{font-size:14px}
.bz .turn{font-size:17px;padding:12px;border-radius:14px}
.bz .sold{padding:18px;font-size:17px;border-radius:16px}
.teams.big{gap:12px}
.teams.big .team{padding:18px 12px 12px;border-radius:24px}
.teams.big .team::before{height:7px}
.teams.big .team h2{font-size:13px;letter-spacing:.1em}
.teams.big .cash{font-size:44px;line-height:1;margin:6px 0 10px;letter-spacing:-.02em}
.teams.big .slot{font-size:14px;padding:9px 6px;gap:8px}
.teams.big .slot b{width:34px;font-size:12px;padding:4px 0}
.teams.big .slot i{font-size:12px}
.teams.big .chem{font-size:12px}
.team.lead{box-shadow:0 0 0 3px var(--gold),var(--sh)}

/* ===== Colourful redesign ===== */
:root{--a:#ff6b2c;--a2:#ffa24d;--b:#2d7bff;--b2:#62b0ff;--gold:#f2a100;--g:#22b85a;--bg:#fff3e2;--bg2:#ffe6c9;--card:#fff;--line:#f3d9b8;--mute:#8a6f55;--fg:#2a1d12}
body{background:radial-gradient(circle at 15% 0,#ffd2a1 0,transparent 42%),radial-gradient(circle at 100% 15%,#b9ddff 0,transparent 42%),radial-gradient(circle at 0 100%,#ffc4de 0,transparent 42%),#fff7ec;background-attachment:fixed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f33;--bg2:#2a1f5e;--card:#211850;--line:#43358a;--mute:#b9aeea;--fg:#f6f2ff;--a:#ff8a4c;--b:#5aa9ff;--gold:#ffc233}body{background:radial-gradient(circle at 15% 0,#4a2a8a 0,transparent 42%),radial-gradient(circle at 100% 15%,#1c4b9a 0,transparent 42%),radial-gradient(circle at 0 100%,#7a2a62 0,transparent 42%),#120c2b}}
h1{font-size:28px;letter-spacing:.01em;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.card,.col,.team,.mc,.sg{border-width:2px;border-radius:24px}
button{border-bottom:4px solid rgba(0,0,0,.28);border-radius:16px;font-weight:900;font-size:16px;box-shadow:0 6px 14px rgba(0,0,0,.12)}
button:active:not(:disabled){transform:translateY(3px);border-bottom-width:1px}
.sold{background:linear-gradient(180deg,#3bd983,#18a34a);color:#fff}
.team.t0{background:linear-gradient(180deg,color-mix(in srgb,var(--a) 20%,var(--card)),var(--card) 70%)}
.team.t1{background:linear-gradient(180deg,color-mix(in srgb,var(--b) 20%,var(--card)),var(--card) 70%)}
.t0 h2{color:#fff;background:var(--a)}.t1 h2{color:#fff;background:var(--b)}
.team h2{display:inline-block;padding:4px 12px;border-radius:999px}
.cash::before{content:"💵 ";font-size:.55em}
.slot b,.pos{color:#fff}
.slot[data-k="PG"] b,.pos[data-k="PG"]{background:#2d7bff}.slot[data-k="SG"] b,.pos[data-k="SG"]{background:#22b85a}.slot[data-k="SF"] b,.pos[data-k="SF"]{background:#ff9f1a}.slot[data-k="PF"] b,.pos[data-k="PF"]{background:#ef4444}.slot[data-k="C"] b,.pos[data-k="C"]{background:#8b5cf6}.slot[data-k^="B"] b{background:#94a3b8}
.steps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0 10px}
.st{font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--bg2);color:var(--mute)}
.st.on{background:linear-gradient(90deg,var(--a),var(--gold));color:#fff;transform:scale(1.07)}
.st.done{background:color-mix(in srgb,var(--g) 25%,var(--card));color:var(--g)}
.sec{color:var(--a);font-size:12px}
.mb{font-size:16px}

/* ===== Setting (lineup) screen ===== */

.tabs{display:flex;gap:6px;padding-left:12px}
.tb{padding:9px 18px;border-radius:14px 14px 0 0;font-weight:900;font-size:14px;background:var(--bg2);color:var(--mute);cursor:pointer;border:2px solid var(--line);border-bottom:0}
.tb.on{background:var(--card);color:var(--fg);box-shadow:0 -3px 0 var(--gold) inset}
.spanel{background:var(--card);border:2px solid var(--line);border-radius:0 22px 22px 22px;padding:12px;margin-bottom:12px}
.court{border-radius:18px;padding:14px 6px 10px;background:repeating-linear-gradient(90deg,#f7b267 0 30px,#f2a65a 30px 60px);border:3px solid #fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.cg{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-areas:"a . b" "c . d" ". e .";row-gap:10px}
.cg>*:nth-child(1){grid-area:a}.cg>*:nth-child(2){grid-area:b}.cg>*:nth-child(3){grid-area:c}.cg>*:nth-child(4){grid-area:d}.cg>*:nth-child(5){grid-area:e}

const BOT_LVL={easy:{n:.4,a:.8},normal:{n:.18,a:1},hard:{n:.06,a:1.12}};
const botTrade=()=>!!(S&&S.over&&!S.sim&&S.trade&&S.trade.a&&S.trade.b&&!S.trade.ok[BOT]&&(S.trades||0)<MAXT);
const botTurn=()=>{if(!S)return false;if(S.over)return botTrade();if(S.place)return S.place.i===BOT;if(!S.cur)return false;if(S.lead===null)return S.op===BOT;if(S.lead===BOT)return full(S.T[1-BOT]);return true};
function botValue(p){
  if(BV&&BV.k===p.n)return BV.v;
  const t=S.T[BOT],n=open(t),L=BOT_LVL[LVL]||BOT_LVL.normal;let v=0;
  if(n>0){
    let w=Math.pow(1.2,p.r-80);
    const es=Object.values(t.roster),have=new Set(es.map(e=>e.n)),ty=typeOf(p);
    GROUPS.forEach(([,...ns])=>{if(ns.includes(p.n)&&ns.some(x=>x!==p.n&&have.has(x)))w*=1.3});
    if(es.some(e=>fits(ty,e.ty)))w*=1.1;
    if(!t.roster[p.p])w*=1.1;
    const base=t.cash/n,cap=Math.max(0,t.cash-(n-1)*.6);
    v=Math.round(Math.max(0,Math.min(cap,base*w*L.a*(1+Math.max(-.5,Math.min(.5,rn()*L.n))))));
  }
  BV={k:p.n,v};return v;
}
function botSlot(p){
  const t=S.T[BOT],free=SLOTS.filter(k=>!t.roster[k]);
  return free.find(k=>k===p.p)||free.find(k=>FLEX[k]===p.p)||free.find(k=>k[0]==='B')||free[0];
}
function botSched(){if(MODE!=='bot'||botT||!S||(S.over&&!botTrade()))return;botT=setTimeout(()=>{botT=null;botAct()},900)}
function botAct(){
  if(MODE!=='bot'||!S)return;
  if(S.over){if(botTrade())botTradeAct();return}
  const B=S.T[BOT],H=S.T[1-BOT],p=S.cur;
  if(S.place){if(S.place.i===BOT)runAct('place',[botSlot(p)],BOT);return}
  if(!p)return;
  const v=botValue(p),b=S.bid;
  if(S.lead===null){if(S.op===BOT)runAct('bid',[BOT,full(H)||B.cash<1?0:Math.min(B.cash,Math.max(1,Math.floor(v*.3)))],BOT);return}
  if(S.lead===BOT){if(full(H))runAct('sold',[],BOT);return}
  if(full(B)||B.cash<=b||v<=b){runAct('sold',[],BOT);return}
  const hm=full(H)?0:H.cash,step=hm<=b+1?1:Math.max(1,Math.round((v-b)*.3));
  runAct('bid',[BOT,Math.min(b+step,v,B.cash)],BOT);
}
function perms(a){if(a.length<2)return[a];const r=[];a.forEach((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).forEach(q=>r.push([x,...q])));return r}
function botLineup(){
  const t=S.T[BOT],es=Object.values(t.roster);if(!es.length)return;
  const sl=SLOTS.slice(0,es.length);let best=null,bs=-1e9;
  perms(es).forEach(pm=>{
    let sc=0,allNat=true;
    pm.forEach((e,j)=>{const k=sl[j];if(k[0]==='B')sc+=.4*e.r0;else{sc+=e.r0-pn(k,e.nat);if(e.nat!==k)allNat=false}});
    if(allNat&&es.length>=5)sc+=10;
    if(sc>bs){bs=sc;best=pm}
  });
  t.roster={};best.forEach((e,j)=>{t.roster[sl[j]]=e});
  const st=sl.filter(k=>k[0]!=='B').map(k=>t.roster[k]).sort((x,y)=>y.r0-x.r0);
  S.cap[BOT]=st.length?st[0].n:null;fix(t);
}

function qJoin(id,slot){
  if(id!==QID)return;
  const peer=new Peer();NET={peer,conn:null};
  let done=false,got=false,to=null;
  const next=()=>{if(done||id!==QID)return;done=true;clearTimeout(to);try{peer.destroy()}catch(e){}NET=null;QMS++;qTry(id)};
  peer.on('open',()=>{
    const c=peer.connect(slot,{serialization:'json',reliable:true});NET.conn=c;

    c.on('open',()=>{try{c.send({t:'name',v:cn(TN1)})}catch(e){}});
    c.on('data',m=>{if(m&&m.t==='st'){if(!got){got=true;done=true;clearTimeout(to);QSR=false;QID=0}MODE='guest';ME=1;S=m.s;BLIND=!!m.b;if(SEL&&!(S.T[SEL[0]]&&S.T[SEL[0]].roster[SEL[1]]))SEL=null;render()}});

  });

function genEvents(q,box){
  const ev=[];
  [0,1].forEach(i=>{
    const pool=[];
    (box[i]||[]).forEach(p=>{let r=p.pts;while(r>0){const x=Math.random();let v=x<.3?3:x<.9?2:1;if(v>r)v=r;pool.push([v,p.n]);r-=v}});

      const st=k<4?k*720:2880+(k-4)*300,len=k<4?720:300,got=[];let need=P;
      while(need>0){
        if(!pool.length)pool.push([need,S.T[i].name]);
        let j=pool.findIndex(x=>x[0]<=need);
        if(j<0){const x=pool[0];pool.splice(0,1,[need,x[1]],[x[0]-need,x[1]]);j=0}
        const x=pool.splice(j,1)[0];got.push(x);need-=x[0];

}
function mStep(i,t0){
  const bar=Math.floor(i/8)%4,s=i%8,t=t0+(s%2?EN*.18:0);
  if(s===0){CH[bar].forEach(f=>mIns(f,t,EN*7.6,'triangle',.045,MB.lp,.35,true));mIns(BASS[bar],t,EN*3,'triangle',.17,MB.lp,.02)}
  if(s===4)mIns(BASS[bar],t,EN*2.6,'triangle',.12,MB.lp,.02);
  if(s===0||s===4)mKick(t);
  if(s===2||s===6)mNoise(t,.12,.05,1800);
  mNoise(t,.04,s%2?.01:.018,6500);
  if(Math.random()<(s%2?.18:.4))mIns(SCL[Math.random()*SCL.length|0],t,EN*(1+Math.random()*1.6),'square',.03,MB.mel,.015,true);
}
function startMusic(){
  if(!MUSIC||MT||!ac())return;
  musBuild();const c=AC;NT=c.currentTime+.15;SI=0;
  MB.mg.gain.cancelScheduledValues(c.currentTime);MB.mg.gain.setTargetAtTime(MV,c.currentTime,1.2);
  MT=setInterval(()=>{if(!AC)return;while(NT<AC.currentTime+.4){mStep(SI++,NT);NT+=EN}},100);
}
function stopMusic(){if(MT){clearInterval(MT);MT=null}if(MB&&AC)MB.mg.gain.setTargetAtTime(0,AC.currentTime,.25)}
function sndUI(){
  const m=document.getElementById('mus'),x=document.getElementById('sfx');
  if(m)m.textContent=MUSIC?'🎵':'🔕';if(x)x.textContent=SFXON?'🔊':'🔇';
}
function musTog(){MUSIC=!MUSIC;try{localStorage.setItem('nbaMusic',MUSIC?'1':'0')}catch(e){}sndUI();MUSIC?startMusic():stopMusic()}
function sfxTog(){SFXON=!SFXON;try{localStorage.setItem('nbaSfx',SFXON?'1':'0')}catch(e){}sndUI()}
(function(){
  const mk=(id,left,fn)=>{const b=document.createElement('button');b.id=id;b.onclick=fn;b.style.cssText='position:fixed;left:'+left+'px;bottom:12px;z-index:99;width:44px;height:44px;border-radius:50%;border:0;font-size:20px;cursor:pointer;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.25);padding:0';document.body.appendChild(b)};
  mk('mus',12,musTog);mk('sfx',64,sfxTog);sndUI();
  document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button,.tb,.pc,.slot,.lvc,.ci,.sg'))clickS()},true);
  const go=()=>{ac();startMusic()};
  document.addEventListener('pointerdown',go,{once:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMusic();else if(MUSIC)startMusic()});
})();
</script></body></html>
